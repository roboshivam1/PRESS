[brand]
id = "basement-supply"
name = "The Basement Supply Co."
tagline = "Born below ground."

[source]
adapter = "basement_supply"
repo_path = "~/Desktop/Development/other/Basement Supply"

[palette]
pitch = "#14100C"
crate = "#201814"
chalk = "#EFE6D8"
dust  = "#9C8B78"
bulb  = "#F2B03D"
moss  = "#77855E"

# [fonts] and [formats.*] arrive with the Composer batches.

[treatment]
saturation = 0.85        # 1.0 = unchanged, 0 = greyscale
shadow_lift = 14         # levels (0-255) added at pure black, fading out by the midtones
shadow_tint = "bulb"     # palette token or hex; sets the warmth of the lift
grain_strength = 6       # grain intensity in levels
grain_size = 1.4         # >1 = softer, larger grain

[crops]
width = 1080
hero = "4:5"
detail = "1:1"
context = "3:2"

[fonts]
caps = { family = "Familjen Grotesk", file = "fonts/FamiljenGrotesk-VF.ttf" }
text = { family = "Outfit", file = "fonts/Outfit-VF.ttf" }
mono = { family = "Sometype Mono", file = "fonts/SometypeMono-VF.ttf" }

[formats.specimen_card]
source = "card"
mode = "plate"           # "falloff" or "plate"
photo_role = "hero"
name_split = " - "       # "The Welder - Skull Edge Sitter" -> title / series line
show_drop = true         # drop code top-right
grain = true             # one grain pass over the finished card

[outbox]
path = "outbox"   # or "~/Library/Mobile Documents/com~apple~CloudDocs/PRESS/outbox" to reach it from your phone

[formats.ledge]
source = "piece"
role = "hero"
ratio = "4:5"
treatment = "full"

[formats.bench]
source = "photo"
ratio = "3:2"
treatment = "full"

[formats.failure]
source = "photo"
ratio = "4:5"            # --ratio 1:1 when it suits the shot
treatment = "full"

[formats.field_report]
source = "photo"
ratio = "4:5"
treatment = "none"       # customer photos: crop only

[formats.placement]
source = "file"          # video, copied as-is

[cadence]
days = ["tuesday", "friday"]
rotation = ["ledge", "bench", "specimen_card"]
cooldown_posts = 6

[cadence.drop_arc]
enabled = true
launch = "2026-11-14"

[[cadence.drop_arc.sequence]]
days_before = 14
format = "specimen-card"
count = 3
note = "first three specimens"

[[cadence.drop_arc.sequence]]
days_before = 11
format = "bench"
count = 0
note = "printing the drop"

[[cadence.drop_arc.sequence]]
days_before = 8
format = "specimen-card"
count = 3

[[cadence.drop_arc.sequence]]
days_before = 6
format = "ledge"
count = 1

[[cadence.drop_arc.sequence]]
days_before = 4
format = "specimen-card"
count = 3

[[cadence.drop_arc.sequence]]
days_before = 2
format = "placement"
count = 1
note = "the piece set down"

[[cadence.drop_arc.sequence]]
days_before = 0
format = "specimen-card"
count = 4
note = "drop day: the rest"
