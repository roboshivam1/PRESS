[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "press"
version = "0.1.0"
description = "Sets and prints. Never publishes."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "pillow>=10.4", "numpy>=1.26"]

[project.scripts]
press = "press.cli:main"

[tool.setuptools.packages.find]
include = ["press*"]
